spring:
  application:
    name: salgu-backend
  config:
    import: optional:classpath:application-secret.yml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
