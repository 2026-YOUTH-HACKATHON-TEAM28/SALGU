[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salgu-property-recommendation"
version = "0.1.0"
description = "과거 전월세 실거래 기반 매물 추천 엔진"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/property_recommendation"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["integration: 실제 PostgreSQL 연결 테스트"]

[tool.ruff.lint.isort]
known-first-party = ["property_recommendation"]

