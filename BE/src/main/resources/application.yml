spring:
  application:
    name: salgu-backend
  config:
    import: optional:classpath:application-secret.yml
  datasource:
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  frontend-url: http://localhost:3000

server:
  port: 8080
  # behind a reverse proxy (sample.localhostbar.com), build redirect URIs from X-Forwarded-* headers
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # blocks the session cookie on cross-site POSTs (CSRF mitigation, see SecurityConfig)
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
