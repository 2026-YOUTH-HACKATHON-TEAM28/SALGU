# Copy to application-secret.yml (git-ignored) and fill in real values.
spring:
  datasource:
    # Supabase > Connect > Session pooler
    url: jdbc:postgresql://<host>.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.<project-ref>
    password: <db-password>
  security:
    oauth2:
      client:
        registration:
          kakao:
            # Kakao Developers > 앱 키 > REST API 키 / 카카오 로그인 > 보안
            client-id: <rest-api-key>
            client-secret: <client-secret>
